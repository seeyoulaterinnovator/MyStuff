dependencies {
    compileOnly "org.keycloak:keycloak-quarkus-server-app:$keycloakVersion"

    implementation(platform("io.quarkus:quarkus-bom:$quarkusVersion"))
    compileOnly "com.fasterxml.jackson.dataformat:jackson-dataformat-xml"

    implementation (
            project(':sso-business-logic'),
    )

    testImplementation "org.keycloak:keycloak-quarkus-server-app:$keycloakVersion"

    testImplementation(platform("io.quarkus:quarkus-bom:$quarkusVersion"))
    testImplementation "com.fasterxml.jackson.dataformat:jackson-dataformat-xml"

    testImplementation "org.wiremock:wiremock:3.9.1"
}
