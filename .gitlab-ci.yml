container:
  stage: docker
  when: manual
  script:
    - $BASE_DIR/scripts/build.sh
  artifacts:
    paths:
      - .ci_status/

dpl:devel:
  stage: deploy
  when: manual
  environment:
    name: devel
  script:
    - $BASE_DIR/scripts/deploy.sh

dpl:stage:
  stage: deploy
  when: manual
  environment:
    name: stage
  script:
    - $BASE_DIR/scripts/deploy.sh
