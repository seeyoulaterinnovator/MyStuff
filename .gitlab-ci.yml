domru:perm:primary:
  stage: deploy
  when: manual
  only:
    - tags
  environment:
    name: stage
    url: http://sso.dev.itrev.ru
  script:
    # themes and text artifacts
    - cp -r build/deploy/themes/domru /usr/local/keycloak/themes
    - scp -r build/deploy/themes/domru sso-app02:/usr/local/keycloak/themes
    - scp -r build/deploy/themes/domru sso-app03:/usr/local/keycloak/themes
    - mkdir -p /usr/local/keycloak/domain/data/password-blacklists
    - cp build/deploy/standalone/data/password-blacklists/black_list_password.txt /usr/local/keycloak/domain/servers/server-one/data/password-blacklists
    - ssh sso-app02 mkdir -p /usr/local/keycloak/domain/data/password-blacklists
    - scp build/deploy/standalone/data/password-blacklists/black_list_password.txt sso-app02:/usr/local/keycloak/domain/servers/server-two/data/password-blacklists
    - ssh sso-app03 mkdir -p /usr/local/keycloak/domain/data/password-blacklists
    - scp build/deploy/standalone/data/password-blacklists/black_list_password.txt sso-app03:/usr/local/keycloak/domain/servers/server-three/data/password-blacklists
    # java artifacts
    - scp build/deploy/standalone/deployments/custom-jpa.jar sso-app02:/usr/local/keycloak/modules/system/layers/base/ru/alamics/sso/jpa/main
    - scp tools/module.xml sso-app02:/usr/local/keycloak/modules/system/layers/base/ru/alamics/sso/jpa/main
    - scp build/deploy/standalone/deployments/custom-jpa.jar sso-app03:/usr/local/keycloak/modules/system/layers/base/ru/alamics/sso/jpa/main
    - scp tools/module.xml sso-app03:/usr/local/keycloak/modules/system/layers/base/ru/alamics/sso/jpa/main
    - cp build/deploy/standalone/deployments/custom-jpa.jar /usr/local/keycloak/modules/system/layers/base/ru/alamics/sso/jpa/main
    - cp tools/module.xml /usr/local/keycloak/modules/system/layers/base/ru/alamics/sso/jpa/main
    - ~/scripts/deploy.sh primary
  tags:
    - sso-domain-controller-perm

