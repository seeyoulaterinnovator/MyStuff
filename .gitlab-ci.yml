domru:voronezh:xml:
  stage: deploy
  when: manual
  only:
    - tags
  environment:
    name: production
    url: http://sso.dev.itrev.ru
  script:
    - rm /usr/local/keycloak/domain/configuration/domain.xml
    - cp -r configs/domain.xml.voronezh /usr/local/keycloak/domain/configuration/domain.xml
    - /usr/local/keycloak/bin/jboss-cli.sh --connect --command-timeout=180 --user=`echo ${JBOSS_CLI_USER_ENC} | base64 -d` --password=`echo ${JBOSS_CLI_PASS_ENC} | base64 -d` --command="reload --host=master --restart-servers=true"
  artifacts: {}
  tags:
    - sso-domain-controller-voronezh

