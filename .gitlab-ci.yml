variables:
  GIT_STRATEGY: fetch
  BASE_DIR: /opt/gitlab-ci
  REGISTRY: registry.alamics.ru

stages:
  - compile
  - test
  - build
  - createwar
  - docker
  - deploy

back:compile:
  stage: compile
  except:
    - master
  script:
    - ./gradlew :classes -Dorg.gradle.java.home=/usr/java/jdk-11.0.2
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
      - build/

back:test:adapter:tbapi-remote-service:
  stage: test
  when: on_success
  except:
    - master
  script:
    - ./gradlew :tbapi-remote-service:check -Dorg.gradle.java.home=/usr/java/jdk-11.0.2
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
      - build/
    policy: pull
  artifacts:
    when: always
    paths:
      - build/test-results/tbapi-remote-service/reports
    name: "tbapi-remote-service-test-reports-$CI_PIPELINE_ID"
    reports:
      junit: build/test-results/tbapi-remote-service/TEST-*.xml

back:test:sso-business-logic:
  stage: test
  when: on_success
  except:
    - master
  script:
    - ./gradlew :sso-business-logic:check -Dorg.gradle.java.home=/usr/java/jdk-11.0.2
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
      - build/
    policy: pull
  artifacts:
    when: always
    paths:
      - build/test-results/sso-business-logic/reports
    name: "sso-business-logic-test-reports-$CI_PIPELINE_ID"
    reports:
      junit: build/test-results/sso-business-logic/TEST-*.xml


back:test:keycloak-extension:
  stage: test
  when: on_success
  except:
    - master
  script:
    - ./gradlew :keycloak-extension:check -Dorg.gradle.java.home=/usr/java/jdk-11.0.2
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
      - build/
    policy: pull
  artifacts:
    when: always
    paths:
      - build/test-results/keycloak-extension/reports
    name: "keycloak-extension-test-reports-$CI_PIPELINE_ID"
    reports:
      junit: build/test-results/keycloak-extension/TEST-*.xml

back:war:
  stage: build
  when: on_success
  except:
    - master
  script:
    - mkdir -p .ci_status
    # remove these two lines
    #- ./gradlew :keycloak-extension:war -Dorg.gradle.java.home=/usr/java/jdk-11.0.2
    #- ./gradlew :custom-jpa-provider:jar -Dorg.gradle.java.home=/usr/java/jdk-11.0.2
    - ./gradlew :deploy -Dorg.gradle.java.home=/usr/java/jdk-11.0.2
    - touch .ci_status/war_built
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
      - build/
  artifacts:
    paths:
      - .ci_status/
      - build/**/libs/*.war
      - build/**/libs/*.jar
      - build/deploy/
    name: "domru-sso-compile-$CI_PIPELINE_ID"
    expire_in: 1 week

