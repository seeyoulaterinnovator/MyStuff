variables:
  GIT_STRATEGY: fetch
  BASE_DIR: /opt/gitlab-ci
  REGISTRY: registry.alamics.ru

stages:
  - compile
  - test
  - build
  - createwar
  - docker
  - deploy

.build: &build-template
  before_script:
  - if [ -f ./gradlew ]; then
  - chmod 775 ./gradlew
  - fi

.decrypt: &decrypt-variables
  before_script:
  - echo ${ERTK_PEM_ENC} | base64 -d > configs/ertk.pem
  - export SSO_DB_USR=`echo ${SSO_DB_USR_ENC} | base64 -d`
  - export SSO_DB_PASS=`echo ${JBOSS_CLI_PASS_ENC} | base64 -d`
  - envsubst < configs/sso.tmpl > configs/sso

back:compile:
  stage: compile
  <<: *build-template
  except:
    - master
  script:
    - if [ -f ./gradlew ]; then chmod 775 ./gradlew; fi
    - ./gradlew :classes --stacktrace -Dorg.gradle.java.home=/usr/java/jdk1.8.0
  cache: {}

back:test:adapter:tbapi-remote-service:
  stage: test
  <<: *build-template
  when: on_success
  except:
    - master
  script:
    - ./gradlew :tbapi-remote-service:check -Dorg.gradle.java.home=/usr/java/jdk1.8.0
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
      - build/
    policy: pull
  artifacts:
    when: always
    paths:
      - build/test-results/tbapi-remote-service/reports
    name: "tbapi-remote-service-test-reports-$CI_PIPELINE_ID"
    reports:
      junit: build/test-results/tbapi-remote-service/TEST-*.xml

back:test:sso-business-logic:
  stage: test
  <<: *build-template
  when: on_success
  except:
    - master
  script:
    - ./gradlew :sso-business-logic:check -Dorg.gradle.java.home=/usr/java/jdk1.8.0
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
    policy: pull
  artifacts:
    when: always
    paths:
      - build/test-results/sso-business-logic/reports
    name: "sso-business-logic-test-reports-$CI_PIPELINE_ID"
    reports:
      junit: build/test-results/sso-business-logic/TEST-*.xml

back:test:keycloak-extension:
  stage: test
  <<: *build-template
  when: on_success
  except:
    - master
  script:
    - ./gradlew :keycloak-extension:check -Dorg.gradle.java.home=/usr/java/jdk1.8.0
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
    policy: pull
  artifacts:
    when: always
    paths:
      - build/test-results/keycloak-extension/reports
    name: "keycloak-extension-test-reports-$CI_PIPELINE_ID"
    reports:
      junit: build/test-results/keycloak-extension/TEST-*.xml

back:war:
  stage: build
  <<: *build-template
  when: on_success
  except:
    - master
  variables:
    NODE_BUILD_PATH: build
  script:
    - currentdir=`pwd`
    # domru theme
    - cd frontend/domru
    - cp /opt/npmrc .npmrc
    - npm clean-install --cache ~/.npm --prefer-offline
    - npm run build
    - mkdir -p ../../keycloak-extension/src/main/resources/themes/domru/login/resources
    - cp -r -f build ../../keycloak-extension/src/main/resources/themes/domru/login/resources
    - cd $currentdir
    # stelecom theme
    - cd frontend/stelecom
    - cp /opt/npmrc .npmrc
    - npm clean-install --cache ~/.npm --prefer-offline
    - npm run build
    - mkdir -p ../../keycloak-extension/src/main/resources/themes/stelecom/login/resources
    - cp -r -f build ../../keycloak-extension/src/main/resources/themes/stelecom/login/resources
    - cd $currentdir
    # ertelecom theme
    - cd frontend/ertelecom
    - cp /opt/npmrc .npmrc
    - npm clean-install --cache ~/.npm --prefer-offline
    - npm run build
    - mkdir -p ../../keycloak-extension/src/main/resources/themes/ertelecom/login/resources
    - cp -r -f build ../../keycloak-extension/src/main/resources/themes/ertelecom/login/resources
    - cd $currentdir
    # deploy
    - mkdir -p .ci_status
    - ./gradlew :deploy -Dorg.gradle.java.home=/usr/java/jdk1.8.0
    - touch .ci_status/war_built
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
  artifacts:
    paths:
      - .ci_status/
      - build/deploy/standalone/deployments/domru-sso.war
      - build/deploy/standalone/deployments/custom-jpa.jar
      - build/deploy/modules/system/layers/base/ru/alamics/sso/jpa/main/module.xml
      - build/deploy/themes/
      - build/deploy/standalone/data/password-blacklists/
    name: "domru-sso-compile-$CI_PIPELINE_ID"
    expire_in: 1 week

container:source:
  stage: docker
  <<: *decrypt-variables
  when: manual
  script:
    - docker build -t harbor.ertelecom.ru/sso-protected/keycloak:6.0.1 -f Dockerfile.intermediate .
    - docker push harbor.ertelecom.ru/sso-protected/keycloak:6.0.1
  artifacts:
    paths:
      - .ci_status/
  tags:
    - sso-stage

container:
  stage: docker
  <<: *decrypt-variables
  when: manual
  script:
    - docker build -t harbor.ertelecom.ru/sso-protected/sso:$CI_PIPELINE_ID -f Dockerfile .
    - docker push harbor.ertelecom.ru/sso-protected/sso:$CI_PIPELINE_ID
  artifacts:
    paths:
      - .ci_status/
  tags:
    - sso-stage

