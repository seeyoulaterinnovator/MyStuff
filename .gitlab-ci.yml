domru:voronezh:xml:
  stage: deploy
  when: manual
  only:
    - tags
  environment:
    name: production
    url: http://sso.dev.itrev.ru
  script:
    - rm /usr/local/keycloak/domain/configuration/domain.xml
    - cp -r configs/domain.xml.voronezh /usr/local/keycloak/domain/configuration/domain.xml
    - /usr/local/keycloak/bin/jboss-cli.sh --connect --command-timeout=180 --user=${JBOSS_CLI_USER} --password=${JBOSS_CLI_PASS} --command="reload --host=master --restart-servers=true"
  artifacts: {}
  resource_group: "${CI_PROJECT_NAMESPACE}${CI_PROJECT_NAME}"
  tags:
    - sso-domain-controller-voronezh

