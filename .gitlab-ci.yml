variables:
  GIT_STRATEGY: fetch
  BASE_DIR: /opt/gitlab-ci
  REGISTRY: registry.alamics.ru

stages:
  - compile
  - test
  - build
  - createwar
  - docker
  - deploy

back:compile:
  stage: compile
  except:
    - master
  script:
    - ./gradlew :classes --stacktrace -Dorg.gradle.java.home=/usr/java/jdk-11.0.2
  cache: {}

back:compile:1.8:
  stage: compile
  except:
    - master
  script:
    - ./gradlew :classes --stacktrace -Dorg.gradle.java.home=/usr/java/jdk1.8.0
  cache: {}

back:test:adapter:tbapi-remote-service:
  stage: test
  when: on_success
  except:
    - master
  script:
    - ./gradlew :tbapi-remote-service:check -Dorg.gradle.java.home=/usr/java/jdk-11.0.2
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
      - build/
    policy: pull
  artifacts:
    when: always
    paths:
      - build/test-results/tbapi-remote-service/reports
    name: "tbapi-remote-service-test-reports-$CI_PIPELINE_ID"
    reports:
      junit: build/test-results/tbapi-remote-service/TEST-*.xml

back:test:adp:tbapi-remote-service:1.8:
  stage: test
  when: on_success
  needs: ["back:compile:1.8"]
  except:
    - master
  script:
    - ./gradlew :tbapi-remote-service:check -Dorg.gradle.java.home=/usr/java/jdk1.8.0
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
      - build/
    policy: pull
  artifacts:
    when: always
    paths:
      - build/test-results/tbapi-remote-service/reports
    name: "tbapi-remote-service-test-reports-$CI_PIPELINE_ID"
    reports:
      junit: build/test-results/tbapi-remote-service/TEST-*.xml

