domru:perm-k8s:
  extends: .domru:prod:template
  tags:
    - sso-k8s-perm
  environment:
    name: production-k8s-perm
    url: https://auth.dom.ru
  variables:
    DC_NAME: perm
    KC_CACHE_CONFIG_FILE: 'cache-ispn.persistent.xml'
    KC_CACHE_STACK: 'kubernetes'
    KC_FEATURES: 'persistent-user-sessions'
    INGRESS_CLASS: "nginx"
    FQDN: "auth.dom.ru"
    VALUES_TLS: "tls: [{secretName: wildcard-dom-ru, hosts: [\"auth.dom.ru\"]}]"
    FQDN2: "auth.domru.ru"
    VALUES_TLS2: "tls: [{secretName: wildcard-domru-ru, hosts: [\"auth.domru.ru\"]}]"
    FQDN3: "auth.ertelecom.ru"
