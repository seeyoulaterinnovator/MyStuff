variables:
  GIT_STRATEGY: fetch

stages:
  - compile
  - test
  - build
  - createwar
  - docker
  - deploy

.domru:stage:template:
  stage: deploy
  image: harbor.ertelecom.ru/b2bweb/kubectl-helm:1.24-alpine
  when: manual
  script:
    - export FQDN=`echo "${CI_ENVIRONMENT_URL}" | sed 's/^http\(\|s\):\/\///g'`
    - consul-template -once -template ".helm/values-dev.yaml.tpl:values.yaml"
    - helm upgrade -i ${CI_ENVIRONMENT_SLUG} --values values.yaml ./.helm -n ${NAMESPACE} --atomic --timeout 10m
    - helm history -n ${NAMESPACE} ${CI_ENVIRONMENT_SLUG} --max 5
  tags:
    - sso-build-k8s

.domru:prod:template:
  stage: deploy
  image: harbor.ertelecom.ru/b2bweb/kubectl-helm:1.24-alpine
  when: manual
  only:
    - tags
  script:
    - export FQDN=`echo "${CI_ENVIRONMENT_URL}" | sed 's/^http\(\|s\):\/\///g'`
    - consul-template -once -template ".helm/values-prod.yaml.tpl:values.yaml"
    - cat values.yaml
    - helm upgrade -i ${CI_ENVIRONMENT_SLUG} --values values.yaml ./.helm -n ${NAMESPACE} --atomic --timeout 20m
    - helm history -n ${NAMESPACE} ${CI_ENVIRONMENT_SLUG} --max 5
  variables:
    NAMESPACE: 'sso'
    NODE_PORT: '30080'
    REPLICA_COUNT: '5'

.frontend:theme:build:
  stage: build
  image: harbor.ertelecom.ru/b2bweb/openjdk:21-node20
  script:
    - cd frontend/$BUILD_THEME
    - npm ci --cache ~/.npm --prefer-offline && npm run build
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - ~/.npm
  artifacts:
    paths:
      - keycloak-extension/src/main/resources/themes/$BUILD_THEME/login/resources/build/
    name: "domru-sso-$CI_PIPELINE_ID"
    expire_in: 1 day
  allow_failure: false
  when: manual
  tags:
    - sso-build-docker

frontend:domru:build:
  extends: .frontend:theme:build
  variables:
    BUILD_THEME: domru

frontend:ertelecom:build:
  extends: .frontend:theme:build
  variables:
    BUILD_THEME: ertelecom

frontend:stelecom:build:
  extends: .frontend:theme:build
  variables:
    BUILD_THEME: stelecom

frontend:novotelecom:build:
  extends: .frontend:theme:build
  variables:
    BUILD_THEME: novotelecom

frontend:admin:build:
  stage: build
  image: harbor.ertelecom.ru/b2bweb/openjdk:21-node20
  script:
    - npm i -g pnpm
    - cd frontend-admin
    - pnpm install
    - cd ../frontend-admin/js/apps/admin-ui
    - pnpm run build
  artifacts:
    paths:
      - keycloak-extension/src/main/resources/themes/keycloak.v2/admin/resources/
    name: "domru-sso-$CI_PIPELINE_ID"
    expire_in: 1 day
  allow_failure: false
  when: manual
  tags:
    - sso-build-docker

back:build:
  stage: build
  image: harbor.ertelecom.ru/b2bweb/openjdk:21-node20
  script:
    - gradle --stacktrace --console=plain build
  cache:
    key: "CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/
  artifacts:
    paths:
      - build/keycloak-extension/libs/keycloak-extension-1.0.1-all.jar
    name: "domru-sso-$CI_PIPELINE_ID"
    expire_in: 1 day
  allow_failure: false
  needs:
    - "frontend:domru:build"
    - "frontend:ertelecom:build"
    - "frontend:stelecom:build"
    - "frontend:admin:build"
    - "frontend:novotelecom:build"
  when: manual
  tags:
    - sso-build-docker

container-image:
  stage: docker
  when: manual
  script:
    - docker build -t harbor.ertelecom.ru/sso-protected/sso:$CI_PIPELINE_ID .
    - docker push harbor.ertelecom.ru/sso-protected/sso:$CI_PIPELINE_ID
  allow_failure: false
  needs:
    - "back:build"
  tags:
    - sso-build-shell

domru:stage:
  extends: .domru:stage:template
  environment:
    name: stage
    url: https://sso-balancer.testing.srv.loc
  variables:
    NAMESPACE: 'sso'
    NODE_PORT: '30081'
    REPLICA_COUNT: '1'
    KC_CACHE_CONFIG_FILE: 'cache-ispn.persistent.xml'
    KC_CACHE_STACK: 'kubernetes'
