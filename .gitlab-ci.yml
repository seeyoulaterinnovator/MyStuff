variables:
  GIT_STRATEGY: fetch
  BASE_DIR: /opt/gitlab-ci

stages:
  - compile
  - test
  - build
  - createwar
  - docker
  - deploy

.build: &build-template
  before_script:
  - if [ -f ./gradlew ]; then
  - chmod 775 ./gradlew
  - fi

.init_vars: &init-variables
  before_script:
  - cp ${ERTK_PEM} configs/ertk.pem
  - envsubst < configs/sso.tmpl > configs/sso

.domru:stage:template:
  stage: deploy
  image: harbor.ertelecom.ru/b2bweb/kubectl-helm:1.24-alpine
  when: manual
  script:
    - export FQDN=`echo "${CI_ENVIRONMENT_URL}" | sed 's/^http\(\|s\):\/\///g'`
    - consul-template -once -template ".helm/values-dev.yaml.tpl:values.yaml"
    - |-
      if [[ -z "$NEW_DB_DATABASE" ]]; then
          export NEW_DB_DATABASE=$DB_DATABASE
      fi
    - echo "DB_DATABASE = ${DB_DATABASE}"
    - echo "NEW_DB_DATABASE = ${NEW_DB_DATABASE}"
    - helm upgrade -i ${CI_ENVIRONMENT_SLUG} --values values.yaml --set extraEnvs.DB_DATABASE=${NEW_DB_DATABASE} ./.helm -n ${NAMESPACE} --atomic --timeout 5m
    - helm history -n ${NAMESPACE} ${CI_ENVIRONMENT_SLUG} --max 5
  tags:
    - sso-build-k8s

.domru:prod:template:
  stage: deploy
  image: harbor.ertelecom.ru/b2bweb/kubectl-helm:1.24-alpine
  when: manual
  only:
    - itres-new-prod
  script:
    - export FQDN=`echo "${CI_ENVIRONMENT_URL}" | sed 's/^http\(\|s\):\/\///g'`
    - consul-template -once -template ".helm/values-prod.yaml.tpl:values.yaml"
    - |-
      if [[ -z "$NEW_DB_DATABASE" ]]; then
          export NEW_DB_DATABASE=$DB_DATABASE
      fi
    - echo "DB_DATABASE = ${DB_DATABASE}"
    - echo "NEW_DB_DATABASE = ${NEW_DB_DATABASE}"
    - cat values.yaml
    - helm upgrade -i ${CI_ENVIRONMENT_SLUG} --values values.yaml --set extraEnvs.DB_DATABASE=${NEW_DB_DATABASE} ./.helm -n ${NAMESPACE} --atomic --timeout 10m
    - helm history -n ${NAMESPACE} ${CI_ENVIRONMENT_SLUG} --max 5
  variables:
    NAMESPACE: 'sso'
    NODE_PORT: '30080'
    REPLICA_COUNT: '5'

.frontend:theme:build:
  stage: build
  image: harbor.ertelecom.ru/b2bweb/openjdk:21-node20
  script:
    - cd frontend/$BUILD_THEME
    - npm ci --cache ~/.npm --prefer-offline && npm run build
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - ~/.npm

  artifacts:
    paths:
      - keycloak-extension/src/main/resources/themes/$BUILD_THEME/login/resources/build/
    name: "domru-sso-$CI_PIPELINE_ID"
    expire_in: 1 day
  only:
    - itres-new
    - itres-new-prod
    - cicd
  allow_failure: false
  when: manual
  tags:
    - sso-build-docker

frontend:domru:build:
  extends: .frontend:theme:build
  variables:
    BUILD_THEME: domru

frontend:ertelecom:build:
  extends: .frontend:theme:build
  variables:
    BUILD_THEME: ertelecom

frontend:stelecom:build:
  extends: .frontend:theme:build
  variables:
    BUILD_THEME: stelecom

frontend:admin:build:
  stage: build
  image: harbor.ertelecom.ru/b2bweb/openjdk:21-node20
  script:
    - npm i -g pnpm
    - cd frontend-admin
    - pnpm install
    - cd ../frontend-admin/js/apps/admin-ui
    - pnpm run build
  artifacts:
    paths:
      - keycloak-extension/src/main/resources/themes/keycloak.v2/admin/resources/
    name: "domru-sso-$CI_PIPELINE_ID"
    expire_in: 1 day
  only:
    - itres-new
    - itres-new-prod
    - cicd
  allow_failure: false
  when: manual
  tags:
    - sso-build-docker

back:build:
  stage: build
  image: harbor.ertelecom.ru/b2bweb/openjdk:21-node20
  <<: *build-template
  script:
    - ./gradlew --stacktrace --console=plain build
  cache:
    key: "CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/
  artifacts:
    paths:
      - build/keycloak-extension/libs/keycloak-extension-1.0.1-all.jar
    name: "domru-sso-$CI_PIPELINE_ID"
    expire_in: 1 day
  allow_failure: false
  only:
    - itres-new
    - itres-new-prod
    - cicd
  needs:
    - "frontend:domru:build"
    - "frontend:ertelecom:build"
    - "frontend:stelecom:build"
    - "frontend:admin:build"
  when: manual
  tags:
    - sso-build-docker

container-image:
  stage: docker
  <<: *init-variables
  when: manual
  script:
    - docker build -t harbor.ertelecom.ru/sso-protected/sso:$CI_PIPELINE_ID -f .gitlab-ci/Dockerfile.ertelecom .
    - docker push harbor.ertelecom.ru/sso-protected/sso:$CI_PIPELINE_ID
  allow_failure: false
  needs:
    - "back:build"
  tags:
    - sso-build-shell

