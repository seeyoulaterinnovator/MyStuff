    - for i in domru stelecom ertelecom; do scp -r build/deploy/themes/${i} sso-app04:/usr/local/keycloak/themes; scp -r build/deploy/themes/${i} sso-app05:/usr/local/keycloak/themes; done
    - ssh sso-app04 mkdir -p /usr/local/keycloak/domain/data/password-blacklists
