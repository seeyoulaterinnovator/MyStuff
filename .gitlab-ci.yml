back:war:
  stage: build
  when: on_success
  except:
    - master
  script:
    - currentdir=`pwd`
    - cd keycloak-extension/src/main/resources/themes/domru/login/resources
    - npm install
    - npm run build
    - rm -rf node_modules
    - cd $currentdir
    - mkdir -p .ci_status
    - ./gradlew :deploy -Dorg.gradle.java.home=/usr/java/jdk-11.0.2
    - touch .ci_status/war_built
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
      - build/
  artifacts:
    paths:
      - .ci_status/
      - build/**/libs/*.war
      - build/**/libs/*.jar
      - build/deploy/
      - tools/module.xml
    name: "domru-sso-compile-$CI_PIPELINE_ID"
    expire_in: 1 week

back:war:1.8:
  stage: build
  when: on_success
  needs: ["back:test:keycloak-extension:1.8"]
  except:
    - master
  script:
    - currentdir=`pwd`
    - cd keycloak-extension/src/main/resources/themes/domru/login/resources
    - npm install
    - npm run build
    - rm -rf node_modules
    - cd $currentdir
    - mkdir -p .ci_status
    - ./gradlew :deploy -Dorg.gradle.java.home=/usr/java/jdk1.8.0
    - touch .ci_status/war_built
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
      - build/
  artifacts:
    paths:
      - .ci_status/
      - build/**/libs/*.war
      - build/**/libs/*.jar
      - build/deploy/
      - tools/module.xml
    name: "domru-sso-compile-$CI_PIPELINE_ID"
    expire_in: 1 week

