variables:
  GIT_STRATEGY: fetch
  BASE_DIR: /opt/gitlab-ci
  REGISTRY: registry.dev.it-resource.team

stages:
  - compile
  - test
  - build
  - createwar
  - docker
  - deploy

.build: &build-template
  before_script:
  - if [ -f ./gradlew ]; then
  - chmod 775 ./gradlew
  - fi

.init_vars: &init-variables
  before_script:
  - cp ${ERTK_PEM} configs/ertk.pem
  - envsubst < configs/sso.tmpl > configs/sso

.domru:stage:template:
  stage: deploy
  image: harbor.ertelecom.ru/b2bweb/kubectl-helm:1.24-alpine
  when: manual
  script:
    - export FQDN=`echo "${CI_ENVIRONMENT_URL}" | sed 's/^http\(\|s\):\/\///g'`
    - consul-template -once -template ".helm/values-dev.yaml.tpl:values.yaml"
    - helm upgrade -i ${CI_ENVIRONMENT_SLUG} --values values.yaml ./.helm -n ${NAMESPACE} --atomic --timeout 5m
    - helm history -n ${NAMESPACE} ${CI_ENVIRONMENT_SLUG} --max 5
  tags:
    - sso-build-k8s

.frontend:theme:build:
  stage: build
  script:
    - export PATH=/usr/nodejs/node-v20/bin:$PATH
    - cd frontend/$BUILD_THEME
    - cp $_NPMRC .npmrc
    - npm i && npm run build
  artifacts:
    paths:
      - keycloak-extension/src/main/resources/themes/$BUILD_THEME/login/resources/build/
    name: "domru-sso-$CI_PIPELINE_ID"
    expire_in: 1 day
  allow_failure: false

frontend:domru:build:
  extends: .frontend:theme:build
  variables:
    BUILD_THEME: domru

frontend:ertelecom:build:
  extends: .frontend:theme:build
  variables:
    BUILD_THEME: ertelecom

frontend:stelecom:build:
  extends: .frontend:theme:build
  variables:
    BUILD_THEME: stelecom

frontend:admin:build:
  stage: build
  except:
    - master
  script:
    - export PATH=/usr/nodejs/node-v20/bin:$PATH
    - cd frontend-admin
    - cp $_NPMRC .npmrc
    - pnpm install
    - cd ../frontend-admin/js/apps/admin-ui
    - pnpm run build
  artifacts:
    paths:
      - keycloak-extension/src/main/resources/themes/keycloak.v2/admin/resources/
    name: "domru-sso-$CI_PIPELINE_ID"
    expire_in: 1 day
  allow_failure: false

back:build:
  stage: build
  <<: *build-template
  except:
    - master
  variables:
    JAVA_HOME: /usr/java/jdk-17
  script:
    - if [ -f ./gradlew ]; then chmod 775 ./gradlew; fi
    - ./gradlew --stacktrace --console=plain build -Dorg.gradle.java.home=$JAVA_HOME
  allow_failure: false
  artifacts:
    paths:
      - build/keycloak-extension/libs/keycloak-extension-1.0.1-all.jar
    name: "domru-sso-$CI_PIPELINE_ID"
    expire_in: 1 day
  cache:
    key: "$CI_COMMIT_SHA"
    paths:
      - .gradle/
  needs:
    - "frontend:domru:build"
    - "frontend:ertelecom:build"
    - "frontend:stelecom:build"
    - "frontend:admin:build"

container-image:source:
  stage: docker
  <<: *init-variables
  when: manual
  script:
    - docker build -t harbor.ertelecom.ru/sso-protected/keycloak:6.0.1 -f Dockerfile.intermediate .
    - docker push harbor.ertelecom.ru/sso-protected/keycloak:6.0.1
  artifacts:
    paths:
      - .ci_status/
  tags:
    - sso-build-shell

container-image:
  stage: docker
  script:
    - docker build --progress=plain -t $REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:$CI_PIPELINE_ID -f .gitlab-ci/Dockerfile .
    - docker login $REGISTRY -u $GROUP_DEPLOYER -p $GROUP_DEPLOYER_PASS
    - docker push $REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:$CI_PIPELINE_ID
  artifacts:
    paths:
      - .ci_status/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "cicd"
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual
  tags:
    - sso-build-shell
  needs:
    - "back:build"

domru:devel:
  stage: deploy
  variables:
    DOCKER_HOST: ssh://swarm2.dev.it-resource.team
  environment:
    name: devel
    url: https://er-sso.dev.it-resource.team
  script:
    - envsubst < .gitlab-ci/docker-compose-template.yml > docker-compose.yml
    - docker login $REGISTRY -u $GROUP_DEPLOYER -p $GROUP_DEPLOYER_PASS
    - docker stack deploy --with-registry-auth -c docker-compose.yml ertelecom-sso
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "cicd"
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual
  needs: ["container-image"]

domru:stage:
  extends: .domru:stage:template
  environment:
    name: stage
    url: https://sso-balancer.testing.srv.loc
  variables:
    NAMESPACE: 'sso'
    NODE_PORT: '30081'
    REPLICA_COUNT: '1'

domru:stage2:
  extends: .domru:stage:template
  environment:
    name: stage2
    url: https://sso-balancer2.testing.srv.loc
  variables:
    NAMESPACE: 'sso'
    NODE_PORT: '30082'
    REPLICA_COUNT: '1'

domru:stage3:
