<!doctype html>
<html lang="en">
<head>
    <title>Client</title>
</head>
<body>
<div id="logon" hidden>
    <label for="realm">Realm</label>
    <select id="realm">
        <option value="user">user</option>
    </select>
    <label for="client">Client</label>
    <select id="client">
        <option value="b2b">b2b</option>
    </select>
    <button id="go">Go</button>
</div>
<div id="redirect" hidden>
    <a id="account" href="">Account</a>
</div>
<script>
  (async function (){
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    if(code) {
      const realm = params.get('realm');
      const client = params.get('client');
      const response = await fetch(`http://localhost:8180/kecyloak/auth/realms/${realm}/protocol/openid-connect/token`, {
        method: 'post',
        body: new URLSearchParams({
          grant_type: 'authorization_code',
          client_id: client,
          redirect_uri: `http://localhost:8180/?realm=${realm}&client=${client}`,
          code
        }),
      });
      const result = await response.json();
      console.log(JSON.stringify(result));
      document.getElementById('account').setAttribute('href', `http://localhost:8080/auth/realms/${realm}/account`);
      // TODO
      document.getElementById('redirect').removeAttribute('hidden');
    } else {
      document.getElementById('go').onclick = () => {
        const realm = document.getElementById('realm').value;
        const client = document.getElementById('client').value;
        document.location = `http://localhost:8080/auth/realms/${realm}/protocol/openid-connect/auth?` + new URLSearchParams({
          response_type: 'code',
          client_id: client,
          redirect_uri: `http://localhost:8180/?realm=${realm}&client=${client}`
        });
      };
      document.getElementById('logon').removeAttribute('hidden');
    }
  })();
</script>
</body>
</html>
