<style>
    .content {
        color: #000000cc;
        font-size: 18px;
        line-height: normal;
        margin: 0;
    }

    .content__heading {
        font-weight: bold;
        font-size: 18px;
    }

    .content__additional {
        color: #505050cc;
        font-size: 12px;
        line-height: 14px;
        font-style: italic;
    }

    .content p {
        padding-top: 20px;
    }

    .content a {
        display: block;
        overflow: hidden;
        text-decoration-line: underline;
        text-overflow: ellipsis;
        font-size: 20px;
        color: #6688c9;

        /* not working in Yandex Mail */
        overflow-wrap: normal;
        word-wrap: initial;
    }

    * {
        margin: 0;
    }

    .mail-wrapper {
        width: 100%;
        background-color: #f3f3f3;
        text-align: center;
    }

  .mail-container {
    max-width: 600px;
    padding: 32px 24px 32px 32px;
    margin: 0 auto;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    color: #000000;
    display: inline-table;
    text-align: left;
  }

    .mail-text--bold {
        font-weight: bold;
    }

    .mail-container__header {
        width: 100%;
        padding-bottom: 24px;
    }

    .logo {
        height: 30px;
        max-height: 30px;
        width: auto;
    }

    .contacts {
        text-decoration: none;
    }

    .contacts__img {
        height: 30px;
        max-height: 30px;
        width: auto;
        padding-top: 7px;
    }

    .contact__number {
        font-size: 16px;
        line-height: 20px;
        letter-spacing: -1px;
        opacity: 0.5;
        color: #000000;
        padding-top: 4px;
        height: 24px;
        padding-bottom: 2px;
    }

    .mail-container__footer {
        padding-top: 41px;
        font-size: 14px;
        line-height: 18px;
        opacity: 0.8;
    }

    .mail-text--copyright {
        padding-top: 31px;
    }

    .mail-text--additional {
        font-size: 12px;
        line-height: 14px;
        font-style: italic;
    }

    .mail-text--small {
        font-size: 14px;
        line-height: 18px;
        padding-bottom: 12px;
    }

    .mail-text--light-gray {
        color: #5050504d;
        font-size: 12px;
        line-height: 25px;
    }

    @media all and (min-width: 420px) {
        .logo,
        .contacts__img {
            max-height: 48px;
            height: 48px;
        }
        .contact__number {
            padding-left: 5px;
            font-size: 20px;
            height: 48px;
        }
    }

</style>
