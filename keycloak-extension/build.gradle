plugins {
    id 'war'
}

dependencies {

    implementation(
            project(':sso-business-logic'),
            project(':tbapi-remote-service'),
            project(':custom-jpa-provider'),
    )

    providedCompile "org.keycloak:keycloak-core:$keycloakVersion"
    providedCompile("org.keycloak:keycloak-services:$keycloakVersion") {
        exclude group: 'org.slf4j'
    }
    providedCompile "org.keycloak:keycloak-server-spi:$keycloakVersion"
    providedCompile "org.keycloak:keycloak-server-spi-private:$keycloakVersion"
    providedCompile "org.keycloak:keycloak-model-jpa:$keycloakVersion"
    providedCompile "org.keycloak:keycloak-model-infinispan:$keycloakVersion"
    providedCompile group: 'javax', name: 'javaee-api', version: '8.0.1'

    implementation 'org.slf4j:slf4j-api:1.7.22'

    // https://mvnrepository.com/artifact/org.jboss.resteasy/resteasy-jaxrs
    implementation group: 'org.jboss.resteasy', name: 'resteasy-jaxrs', version: '3.9.0.Final'
    implementation 'org.jboss.resteasy:resteasy-jackson2-provider:3.6.3.Final'
    // https://mvnrepository.com/artifact/javax.ejb/ejb-api
//    providedCompile group: 'javax.ejb', name: 'ejb-api', version: '3.0'

    providedCompile group: 'org.apache.xmlbeans', name: 'xmlbeans', version: '3.0.0'
    providedCompile group: 'org.bouncycastle', name: 'bcprov-jdk15on', version: '1.60'
    providedCompile group: 'org.bouncycastle', name: 'bcmail-jdk15on', version: '1.60'

    // https://mvnrepository.com/artifact/com.google.guava/guava
    compile group: 'com.google.guava', name: 'guava', version: '28.2-jre'
    compile group: 'commons-io', name: 'commons-io', version: '2.5'
}

war {
    manifest {
        attributes(
                'Dependencies': 'org.infinispan'
        )
    }
}
