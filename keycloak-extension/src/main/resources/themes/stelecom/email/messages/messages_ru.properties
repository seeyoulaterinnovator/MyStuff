emailResetPasswordSubject=Ваш пароль для входа в Личный кабинет сброшен
emailResetPasswordBody=Пароль вашей учетной записи был сброшен.\n\nУстановите новый пароль по ссылке\n\n{2}\n\nчтобы завершить процесс и восстановить доступ к личному кабинету. Срок действия ссылки 12 часов. \n\nВаш логин:\n{0}\nили\n{1}
emailResetPasswordBodyHtml=<p class="content__p">Пароль вашей учетной записи был сброшен.<br />Установите новый пароль по <a class="content__a no_block" href="{0}">ссылке</a>, чтобы завершить процесс и восстановить доступ к личному кабинету.</p><p class="content__p content__additional">Срок действия ссылки 12 часов.</p>

emailPasswordFooterHtml=<p class="content__p">Мы не храним ваши пароли.<br />Если вы забыли свой пароль или у вас не получается войти в Личный кабинет &ndash; воспользуйтесь формой восстановления пароля по кнопке <a class="content__a no_block" href="http://lkb2b.tcenter.ru">«Забыли пароль?»</a></p><ul class="content__ul"><li class="content__ul-li">Для восстановления данных укажите ваш логин</li><li class="content__ul-li">На ваш адрес электронной почты будет отправлена ссылка для восстановления пароля.<br />Срок действия ссылки 5 минут</li></ul>

