emailPasswordFooterHtml=<p>Мы не храним ваши пароли.</p><p>Если вы забыли свой пароль или у вас не получается войти в <a class="no_block" href="https://newlkb2b.dom.ru">Личный кабинет</a> - воспользуйтесь формой восстановления пароля по кнопке «Забыли пароль?»</p><p><ul><li>Для восстановления данных укажите ваш логин</li><li>На ваш адрес электронной почты будет отправлена ссылка для восстановления пароля.<br>Срок действия ссылки 5 минут</li></ul></p><br><p><a class="no_block" href="https://newlkb2b.dom.ru">Перейти в Личный кабинет</a></p>

