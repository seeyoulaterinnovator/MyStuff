identityProviderLinkSubject=Ссылка {0}
identityProviderLinkBody=Был создан запрос на связь Вашей учетной записи "{1}" с "{0}" учетной записью пользователя {2} . Если это были Вы, нажмите по ссылке, чтобы связать учетные записи\n\n{3}\n\nЭта ссылка устареет через {4} минут.\n\nЕсли Вы не хотите объединять учетные записи, просто проигнориуйте это письмо. После объединения учетных записей Вы можете войти в  {1} через {0}.
identityProviderLinkBodyHtml=<p>Был создан запрос на связь Вашей учетной записи <a class="no_block" href="mailto:{1}">{1}</a> с учетной записью пользователя {2} {0}. После объединения учетных записей Вы можете войти в Личный кабинет «Дом.ru Бизнес» <a class="no_block" href="mailto:{1}">{1}</a> через {0}. Если это были Вы, пройдите по ссылке, чтобы связать учетные записи.</p><p><a href="{3}">Связать учетные записи</a></p><p>Эта ссылка устареет через 24 часа.</p><p class="content__additional">Если Вы не хотите объединять учетные записи, проигнорируйте это письмо.</p>

