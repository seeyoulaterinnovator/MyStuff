emailVerificationSubject=Подтверждение E-mail
emailVerificationBody=Была создана учетная запись {2}. Если это были Вы, пройдите по ссылке для подтверждения вашего email\n\n{0}\n\nЭта ссылка устареет через 72 часа.\n\nЕсли Вы не создавали учетную запись, просто проигнорируйте это письмо.
emailVerificationBodyHtml=<p class="content__p">Была создана учетная запись <a class="content__a no_block" href="mailto:{2}">{2}</a>. Если это были Вы, пройдите по ссылке для подтверждения вашего email.</p><p><a class="content__a" href="{0}">Подтвердить E-mail</a></p><p>Эта ссылка устареет через {4}.</p><p class="content__additional">Если Вы не создавали учетную запись, просто проигнорируйте это письмо.</p>

emailVerificationLoginBodyHtml=<p class="content__p">Подтвердите Вашу учетную запись для входа в Личный кабинет «Телеком Центр бизнес». Срок действия ссылки {4}.</p><p><a href="{0}" class="content__a no_block">Подтвердить учетную запись</a></p>

identityProviderLinkSubject=Ссылка {0}
identityProviderLinkBody=Был создан запрос на связь Вашей учетной записи "{1}" с "{0}" учетной записью пользователя {2} . Если это были Вы, нажмите по ссылке, чтобы связать учетные записи\n\n{3}\n\nЭта ссылка устареет через {4} минут.\n\nЕсли Вы не хотите объединять учетные записи, просто проигнориуйте это письмо. После объединения учетных записей Вы можете войти в  {1} через {0}.
identityProviderLinkBodyHtml=<p class="content__p">Был создан запрос на связь Вашей учетной записи <a class="content__a no_block" href="mailto:{1}">{1}</a> с учетной записью пользователя {2} {0}. После объединения учетных записей Вы можете войти в Личный кабинет «Телеком Центр бизнес» <a class="content__a no_block" href="mailto:{1}">{1}</a> через {0}. Если это были Вы, пройдите по ссылке, чтобы связать учетные записи.</p><p><a href="{3}">Связать учетные записи</a></p><p class="content__additional">Эта ссылка устареет через 24 часа.</p><p class="content__additional">Если Вы не хотите объединять учетные записи, проигнорируйте это письмо.</p>

passwordResetSubject=Сброс пароля
passwordResetBody=Был создан запрос на изменение пароля от Вашей учетной записи {2}. Если это были Вы, пройдите по ссылке {0}\n\nЭта ссылка устареет через {1} минут.\n\nЕсли Вы не хотите сбрасывать пароль, просто проигнорируйте это письмо.
passwordResetBodyHtml=<p class="content__p">Был создан запрос на изменение пароля от Вашей учетной записи <a href="mailto:{2}" class="content__a no_block">{2}</a>. Если это были Вы, пройдите по ссылке:</p><p><a href="{0}" class="content__a no_block">Изменить пароль</a></p><p class="content__additional">Эта ссылка устареет через {1}.<br />Если Вы не хотите сбрасывать пароль, просто проигнорируйте это письмо.</p>

executeActionsSubject=Обновление Вашей учетной записи
executeActionsBody=Администратор «Телеком Центр бизнес» просит обновить Вас данные учетной записи {2}. Пройдите по ссылке {0}, чтобы начать этот процесс. \n\nЭта ссылка устареет через {5}.
executeActionsBodyHtml=<p class="content__p">Администратор «Телеком Центр бизнес» просит обновить Вас данные учетной записи <a class="content__a no_block" href="mailto:{2}">{2}</a>. Пройдите по ссылке</p><p><a class="no_block" href="{0}">Обновить данные</a>,</p><p>чтобы начать этот процесс.</p><p>Эта ссылка устареет через {5}.</p>

