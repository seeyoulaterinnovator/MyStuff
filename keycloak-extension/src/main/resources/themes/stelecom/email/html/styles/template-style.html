
<style>
    html {
        line-height: 1.15;
        -webkit-text-size-adjust: 100%;
    }
    body {
        margin: 0;
    }
    main {
        display: block;
    }
    h1 {
        font-size: 2em;
        margin: 0.67em 0;
    }
    hr {
        box-sizing: content-box;
        height: 0;
        overflow: visible;
    }
    pre {
        font-family: monospace, monospace;
        font-size: 1em;
    }
    a {
        background-color: transparent;
    }
    abbr[title] {
        border-bottom: none;
        text-decoration: underline;
        text-decoration: underline dotted;
    }
    b,
    strong {
        font-weight: bolder;
    }
    code,
    kbd,
    samp {
        font-family: monospace, monospace;
        font-size: 1em;
    }
    small {
        font-size: 80%;
    }
    sub,
    sup {
        font-size: 75%;
        line-height: 0;
        position: relative;
        vertical-align: baseline;
    }
    sub {
        bottom: -0.25em;
    }
    sup {
        top: -0.5em;
    }
    img {
        border-style: none;
    }
    button,
    input,
    optgroup,
    select,
    textarea {
        font-family: inherit;
        font-size: 100%;
        line-height: 1.15;
        margin: 0;
    }
    button,
    input {
        overflow: visible;
    }
    button,
    select {
        text-transform: none;
    }
    button,
    [type="button"],
    [type="reset"],
    [type="submit"] {
        -webkit-appearance: button;
    }
    button::-moz-focus-inner,
    [type="button"]::-moz-focus-inner,
    [type="reset"]::-moz-focus-inner,
    [type="submit"]::-moz-focus-inner {
        border-style: none;
        padding: 0;
    }
    button:-moz-focusring,
    [type="button"]:-moz-focusring,
    [type="reset"]:-moz-focusring,
    [type="submit"]:-moz-focusring {
        outline: 1px dotted ButtonText;
    }
    fieldset {
        padding: 0.35em 0.75em 0.625em;
    }
    legend {
        box-sizing: border-box;
        color: inherit;
        display: table;
        max-width: 100%;
        padding: 0;
        white-space: normal;
    }
    progress {
        vertical-align: baseline;
    }
    textarea {
        overflow: auto;
    }
    [type="checkbox"],
    [type="radio"] {
        box-sizing: border-box;
        padding: 0;
    }
    [type="number"]::-webkit-inner-spin-button,
    [type="number"]::-webkit-outer-spin-button {
        height: auto;
    }
    [type="search"] {
        -webkit-appearance: textfield;
        outline-offset: -2px;
    }
    [type="search"]::-webkit-search-decoration {
        -webkit-appearance: none;
    }
    ::-webkit-file-upload-button {
        -webkit-appearance: button;
        font: inherit;
    }
    details {
        display: block;
    }
    summary {
        display: list-item;
    }
    template {
        display: none;
    }
    [hidden] {
        display: none;
    }
</style>

<style>
    body {
        font-family: Arial, sans-serif;
        color: #000;
    }

    a, a:visited {
        color: #007BFB;
    }

    a:hover {
        color: #0FC8F9 !important;
    }

    .content {
        width: 100%;
        font-size: 18px;
        line-height: 24px;
        margin: 0;
    }

    .content__heading {
        font-size: 32px;
        font-weight: 700;
        line-height: 40px;
    }

    .content__secondary {
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.02em;
    }

    .content__secondary-mt {
        margin-top: 16px;
    }

    .content__additional {
        opacity: 0.5;
        font-size: 12px;
        line-height: 14px;
    }

    .mail-wrapper {
        width: 100%;
        background-color: #FFFFFF;
        text-align: center;
    }

    .mail-container {
        max-width: 600px;
        padding: 40px 24px 40px 24px;
        margin: 0 auto;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
        display: inline-table;
        text-align: left;
    }

    .mail-container__header {
        width: 100%;
        padding-bottom: 40px;
        border-bottom-width: 1px;
        border-bottom-color: #CFDBE0;
        border-bottom-style: solid;
    }

    .mail-text-title {
        margin-top: 40px;
        margin-bottom: 16px;
        font-weight: bold;
    }

    .mail-text-title-secondary {
        margin-top: 40px;
        margin-bottom: 8px;
        font-weight: bold;
    }

    .messengers {
        margin-top: 16px;
        text-align: center;
    }

    .messengers img {
        width: 120px;
        height: 120px
    }

    .messengers-links td {
        font-size: 12px;
        line-height: 16px;
        letter-spacing: 0.5px;
        text-align: center;
        vertical-align: top;
    }

    .mail-text--translucent {
        margin-top: 8px;
        font-size: 12px;
        line-height: 16px;
        opacity: 0.5;
    }

    .contacts {
        text-decoration: none;
    }

    .contact__number {
        font-size: 20px;
        line-height: 25px;
        letter-spacing: -1px;
        text-align: right;
    }

    .system_link {
        font-size: 12px;
        line-height: 16px;
    }

    .mail-text--light-gray {
        opacity: 0.5;
        font-size: 12px;
    }

    .text_bold {
        font-weight: bold;
        font-size: 18px;
        line-height: 24px;
    }

    .text_bolid {
        font-weight: bold;
        font-size: 18px;
        line-height: 24px;
    }

    .no_block {
        display: inline !important;
        white-space: nowrap;
    }

    .instruction {
        font-size: 12px;
        line-height: 16px;
        margin-top: 16px;
        margin-left: 20px;
    }

    .instruction_text {
        margin-top: 8px;
        margin-bottom: 8px;
    }

    .mark {
        background-color: #0CB779;
        width: 8px;
        height: 8px;
        display: inline-block;
        border-radius: 8px;
        margin-right: 8px;
        vertical-align: middle;
    }

    .small_text {
        font-size: 12px;
        line-height: 16px;
    }

    .big_text {
        font-size: 18px;
        line-height: 16px;
    }

    .block_timer {
        margin-top: 16px;
    }

    .login_data {
        margin-top: 16px;
        margin-bottom: 16px;
    }

    .block_login {
        margin-bottom: 16px;
    }

    .block_link {
        margin-top: 16px;
        margin-bottom: 16px;
    }

    .margin_block {
        margin-top: 16px;
    }
</style>
