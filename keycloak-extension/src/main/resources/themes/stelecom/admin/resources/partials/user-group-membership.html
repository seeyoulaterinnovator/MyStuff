<div class="col-sm-9 col-md-10 col-sm-push-3 col-md-push-2">
    <ol class="breadcrumb">
        <li><a href="#/realms/{{realm.realm}}/users">{{:: 'users' | translate}}</a></li>
        <li>{{user.username}}</li>
    </ol>

    <kc-tabs-user></kc-tabs-user>

    <form class="form-horizontal" name="realmForm" novalidate>
        <div class="form-group"
             kc-read-only="!(user.access.manageGroupMembership && auth.authz.realm === 'master' || user.access.manage && access.editGroups)">
            <label class="col-md-1 control-label" class="control-label"></label>

            <div class="col-md-8">
                <div class="row">
                    <div class="col-md-5">
                        <table class="table table-striped table-bordered" style="margin-bottom: 0">
                            <thead>
                            <tr>
                                <th class="kc-table-actions" colspan="5">
                                    <div class="form-inline">
                                        <div>
                                            <label class="control-label">{{:: 'group-membership' | translate}}</label>
                                            <kc-tooltip>{{:: 'group-membership.tooltip' | translate}}</kc-tooltip>
                                        </div>
                                        <div class="pull-left">
                                            <div class="input-group">
                                                <input class="form-control search" ng-model="searchCriteriaMembership"
                                                       onkeydown="if (event.keyCode == 13) document.getElementById('groupSearch').click()"
                                                       placeholder="{{:: 'search.placeholder' | translate}}"
                                                       type="text">
                                                <div class="input-group-addon">
                                                    <i class="fa fa-search" id="groupSearch"
                                                       ng-click="searchGroupMembership()"></i>
                                                </div>
                                            </div>
                                        </div>
                                        &nbsp;
                                        <button class="btn btn-default" id="viewAllGroups"
                                                ng-click="clearSearchMembership()">{{:: 'view-all-groups' | translate}}
                                        </button>
                                        <div class="pull-right"
                                             data-ng-show="user.access.manageGroupMembership && auth.authz.realm === 'master' || user.access.manage && access.editGroups">
                                            <button class="btn btn-default" id="leaveGroups" ng-click="leaveGroup()">
                                                {{:: 'leave' | translate}}
                                            </button>
                                        </div>
                                    </div>
                                </th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td>
                                    <div
                                            angular-treeview="true"
                                            node-children="subGroupsMembership"
                                            node-id="id"
                                            node-label="name"
                                            tree-id="membershipTree"
                                            tree-model="groupMemberships">
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <div style="margin-bottom: 50px">
                            <kc-paging current-page="currentMembershipPage"
                                       current-page-input="currentMembershipPageInput"
                                       number-of-pages="numberOfMembershipPages"></kc-paging>
                        </div>
                    </div>
                    <div class="col-md-5">
                        <table class="table table-striped table-bordered" style="margin-bottom: 0">
                            <thead>
                            <tr>
                                <th class="kc-table-actions" colspan="5">

                                    <div class="form-inline">
                                        <div>
                                            <label class="control-label">{{:: 'available-groups' | translate}}</label>
                                            <kc-tooltip>{{:: 'membership.available-groups.tooltip' | translate}}
                                            </kc-tooltip>
                                        </div>
                                        <div class="pull-left">
                                            <div class="input-group">
                                                <input class="form-control search" ng-model="searchCriteria"
                                                       onkeydown="if (event.keyCode == 13) document.getElementById('groupSearch').click()"
                                                       placeholder="{{:: 'search.placeholder' | translate}}"
                                                       type="text">
                                                <div class="input-group-addon">
                                                    <i class="fa fa-search" id="groupSearch_availablegroups"
                                                       ng-click="searchGroup()"></i>
                                                </div>
                                            </div>
                                        </div>
                                        &nbsp;
                                        <button class="btn btn-default" id="viewAllGroups" ng-click="clearSearch()">
                                            {{:: 'view-all-groups' | translate}}
                                        </button>
                                        <div class="pull-right"
                                             data-ng-show="user.access.manageGroupMembership && auth.authz.realm === 'master' || user.access.manage && access.editGroups">
                                            <button class="btn btn-default" id="joinGroup" ng-click="joinGroup()">
                                                {{:: 'join' | translate}}
                                            </button>
                                        </div>
                                    </div>
                                </th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td>
                                    <div
                                            angular-treeview="true"
                                            node-children="subGroups"
                                            node-id="id"
                                            node-label="name"
                                            tree-id="tree"
                                            tree-model="groupList">
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <div style="margin-bottom: 50px">
                            <kc-paging current-page="currentPage" current-page-input="currentPageInput"
                                       number-of-pages="numberOfPages"></kc-paging>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<kc-menu></kc-menu>
