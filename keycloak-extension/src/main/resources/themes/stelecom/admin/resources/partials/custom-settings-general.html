<div class="col-sm-9 col-md-10 col-sm-push-3 col-md-push-2">

    <h1>Additional Ream settings</h1>
    <form class="form-horizontal" name="realmForm" novalidate>
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>Name</th>
                <th>Value</th>
                <th>Unit</th>
                <th>Description</th>
                <th colspan="2">{{:: 'actions' | translate}}</th>
            </tr>
            </thead>
            <tbody>
                <tr ng-repeat="setting in settings">
                    <td class="clip">{{setting.name}}</td>
                    <td class="clip">
                        <input class="form-control" type="text" ng-model="setting.value" name="setting-value"/>
                    </td>
                    <td class="clip">
                        <select class="form-control" name="TimeoutUnit" data-ng-model="setting.unit">
                            <option value="SECONDS">{{:: 'seconds' | translate}}</option>
                            <option value="MINUTES">{{:: 'minutes' | translate}}</option>
                            <option value="HOURS">{{:: 'hours' | translate}}</option>
                            <option value="DAYS">{{:: 'days' | translate}}</option>
                        </select>
                    </td>
                    <td class="clip">{{setting.desc}}</td>
                    <td class="kc-action-cell" data-ng-click="updateSetting(setting)">{{:: 'save' | translate}}</td>
                </tr>
            </tbody>
        </table>
    </form>
</div>
