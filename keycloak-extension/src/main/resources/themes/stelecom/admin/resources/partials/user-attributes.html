<div class="col-sm-9 col-md-10 col-sm-push-3 col-md-push-2">
    <ol class="breadcrumb">
        <li><a href="#/realms/{{realm.realm}}/users">{{:: 'users' | translate}}</a></li>
        <li>{{user.username}}</li>
    </ol>

    <kc-tabs-user></kc-tabs-user>

    <form class="form-horizontal"
          kc-read-only="!(user.access.manage && (auth.authz.realm === 'master' || access.editAttributes))"
          name="realmForm"
          novalidate>
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>{{:: 'key' | translate}}</th>
                <th>{{:: 'value' | translate}}</th>
                <th>{{:: 'actions' | translate}}</th>
            </tr>
            </thead>
            <tbody>
            <tr ng-repeat="(key, value) in user.attributes | toOrderedMapSortedByKey">
                <td>{{key}}</td>
                <td><input class="form-control" id="attribute-{{key}}" name="{{key}}" ng-model="user.attributes[key]"
                           type="text"/></td>
                <td class="kc-action-cell" data-ng-click="removeAttribute(key)">{{:: 'delete' | translate}}</td>
            </tr>
            <tr>
                <td><input class="form-control" id="newAttributeKey" ng-model="newAttribute.key" type="text"/></td>
                <td><input class="form-control" id="newAttributeValue" ng-model="newAttribute.value" type="text"/></td>
                <td class="kc-action-cell" data-ng-click="addAttribute()"
                    data-ng-disabled="!newAttribute.key.length || !newAttribute.value.length">{{:: 'add' | translate}}
                </td>
            </tr>
            </tbody>
        </table>

        <div class="form-group"
             data-ng-show="user.access.manage && (auth.authz.realm === 'master' || access.editAttributes)">
            <div class="col-md-12">
                <button data-ng-disabled="!changed" kc-save>{{:: 'save' | translate}}</button>
                <button data-ng-disabled="!changed" kc-reset>{{:: 'cancel' | translate}}</button>
            </div>
        </div>
    </form>
</div>

<kc-menu></kc-menu>
