<div class="col-sm-9 col-md-10 col-sm-push-3 col-md-push-2">
    <ol class="breadcrumb">
        <li><a href="#/realms/{{realm.realm}}/users">{{:: 'users' | translate}}</a></li>
        <li>{{user.username}}</li>
    </ol>

    <kc-tabs-user></kc-tabs-user>

    <form class="form-horizontal" name="realmForm" novalidate kc-read-only="!user.access.manage">
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>tomsId</th>
                <th>role</th>
                <th>system</th>
                <th>{{:: 'actions' | translate}}</th>
            </tr>
            </thead>
            <tbody>
            <tr ng-repeat="userPost in userPosts ">
                <td>{{userPost.tomsId}}</td>
                <td>{{userPost.userRole.name}}
                    <select ng-model="selectedCustomerRole[$index]" ng-options="y.name for (x, y) in customerRoles"> </select>
                    <div data-ng-click="editUserPost(userPost.id, selectedCustomerRole[$index].id)"style="color: #6688c9">change</div></td>
                <td>
                    <div ng-repeat="roleExt in userPost.systemRoles">
                        {{roleExt.name}} <div data-ng-click="removeSystemRole(userPost.id, roleExt.id)" style="color: #6688c9">delete</div>
                    </div>

                    <select ng-model="selectedSystemRole[$index]"
                            ng-options="y.name for (x, y) in systemRoles"> </select>

                    <div data-ng-click="addSystemRole(userPost.id, selectedSystemRole[$index].id)" style="color: #6688c9">add</div>
                </td>
                <td class="kc-action-cell" data-ng-click="removeUserPost(userPost.id)">{{:: 'delete' | translate}}</td>
            </tr>
            <tr>
                <td><input ng-model="newAccess.tomsId" class="form-control" type="text" id="newTomsId"/></td>
                <td><select ng-model="newAccess.customerRole" ng-options="y.name for (x, y) in customerRoles"> </select>
                    {{newAccess.customerRole}}
                </td>
                <td><select ng-model="newAccess.systemRole" ng-options="y.name for (x, y) in systemRoles"></select>
                    {{newAccess.systemRole}}
                </td>
                <td class="kc-action-cell" data-ng-click="addUserPost()"
                    data-ng-disabled="!newAccess.key.length || !newAttribute.value.length">{{:: 'add' | translate}}
                </td>
            </tr>
            </tbody>
        </table>

        <!--<div class="form-group" data-ng-show="user.access.manage">-->
        <!--<div class="col-md-12">-->
        <!--<button kc-save  data-ng-disabled="!changed">{{:: 'save' | translate}}</button>-->
        <!--<button kc-reset data-ng-disabled="!changed">{{:: 'cancel' | translate}}</button>-->
        <!--</div>-->
        <!--</div>-->
    </form>
</div>

<kc-menu></kc-menu>
