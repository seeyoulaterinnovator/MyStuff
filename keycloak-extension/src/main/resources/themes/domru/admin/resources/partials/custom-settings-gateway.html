<div class="col-sm-9 col-md-10 col-sm-push-3 col-md-push-2">

    <h1>Sender gateway</h1>
    <kc-tabs-settings></kc-tabs-settings>
    <form class="form-horizontal" name="frontForm" novalidate>
        <table class="table table-striped table-bordered">
            <thead>
            <tr>
                <th>Name</th>
                <th>Value</th>
                <th>Description</th>
                <th colspan="2">{{:: 'actions' | translate}}</th>
            </tr>
            </thead>
            <tbody>
            <tr data-ng-if="setting.type=='EMAIL'" ng-repeat="setting in settings">
                <td class="clip" title="{{setting.name}}">{{setting.name}}</td>
                <td class="clip" title="{{setting.value}}">
                    <input class="form-control" name="setting-value" ng-model="setting.value" type="text"/>
                </td>
                <td class="clip" title="{{setting.desc}}">{{setting.desc}}</td>
                <td class="kc-action-cell" data-ng-click="updateSetting(setting)">{{:: 'save' | translate}}</td>
            </tr>
            </tbody>
        </table>
    </form>
</div>
<kc-menu></kc-menu>
