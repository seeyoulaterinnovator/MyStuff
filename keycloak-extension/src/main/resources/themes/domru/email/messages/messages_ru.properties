identityProviderLinkSubject=Ссылка {0}
identityProviderLinkBody=Кто-то хочет связать вашу учетную запись "{1}" с "{0}" учетной записью пользователя {2} . Если это были Вы, нажмите по ссылке, чтобы связать учетные записи\n\n{3}\n\nЭта ссылка устареет через {4} минут.\n\nЕсли Вы не хотите объединять учетные записи, просто проигнориуйте это письмо. После объединения учетных записей Вы можете войти в  {1} через {0}.
identityProviderLinkBodyHtml=<p>Кто-то хочет связать вашу учетную запись <b>{1}</b> с <b>{0}</b> учетной записью пользователя {2}. Если это были Вы, нажмите по ссылке, чтобы связать учетные записи</p><p><a href="{3}">Связать учетные записи</a></p><p>Эта ссылка устареет через  {4} минут.</p><p class="content__additional">Если Вы не хотите объединять учетные записи, просто проигнориуйте это письмо. После объединения учетных записей Вы можете войти в  {1} через {0}.</p>

passwordResetSubject=Сброс пароля
passwordResetBody=Кто-то только что запросил изменение пароля от Вашей учетной записи {2}. Если это были Вы, нажмите на следующую ссылку, чтобы сбросить его.\n\n{0}\n\nЭта ссылка устареет через {1} минут.\n\nЕсли Вы не хотите сбрасывать пароль, просто проигнорируйте это письмо.
passwordResetBodyHtml=<p>Кто-то только что запросил изменение пароля от Вашей учетной записи {2}. Если это были Вы, нажмите на следующую ссылку, чтобы сбросить его.</p><p><a href="{0}">Изменить пароль</a></p><p>Эта ссылка устареет через  {1} минут.</p><p class="content__additional">Если Вы не хотите сбрасывать пароль, просто проигнорируйте это письмо и ничего не изменится.</p>

executeActionsSubject=Обновление Вашей учетной записи
executeActionsBody=Администратор просит Вас обновить данные Вашей учетной записи {2}. Нажмите по следующей ссылке чтобы начать этот процесс.\n\n{0}\n\nЭта ссылка устареет через {1} минут.\n\nЕсли у Вас есть подозрения, что администратор не мог сделать такой запрос, просто проигнорируйте это письмо.
