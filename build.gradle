plugins {
    id 'java'
    id 'idea'
    id 'com.bmuschko.docker-remote-api' version '4.10.0'
}

import com.bmuschko.gradle.docker.tasks.container.*
import com.bmuschko.gradle.docker.tasks.image.*

apply plugin: 'idea'

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

allprojects {
    group = 'ru.alamics.sso'
    version = '0.0.1'

    ext {
        keycloakVersion = '6.0.1'
        lombokVersion = '1.18.8'
        junitVersion = '5.5.0'
    }
}

subprojects {
    buildDir = new File(rootProject.projectDir, "build/" + project.name)
    
}

repositories {
    jcenter()
}

dependencies {
    implementation "org.keycloak:keycloak-core:$keycloakVersion"
    implementation "org.keycloak:keycloak-services:$keycloakVersion"
    implementation "org.keycloak:keycloak-server-spi:$keycloakVersion"
    implementation "org.keycloak:keycloak-server-spi-private:$keycloakVersion"
    implementation "org.keycloak:keycloak-model-jpa:$keycloakVersion"


    testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitVersion"
    testCompile group: 'org.assertj', name: 'assertj-core', version: '3.12.2'
    testCompile group: 'org.mockito', name: 'mockito-junit-jupiter', version: '2.28.2'

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
}

test {
    // Use junit platform for unit tests
    useJUnitPlatform()
}


//////////// DOCKER
// POSTGRES
task postgresPull(type: DockerPullImage) {
    repository = 'postgres'
    tag = "latest"
}

task postgresCreate(type: DockerCreateContainer) {
    dependsOn postgresPull
    targetImageId postgresPull.getImageId()
    containerName = "$project.group-postgres"
    portBindings = ['5433:5432']
    withEnvVar('POSTGRES_USER', 'postgres')
    withEnvVar('POSTGRES_PASSWORD', 'postgres')
    withEnvVar('POSTGRES_DB', 'keycloak')
}

task postgresStart(type: DockerStartContainer) {
    dependsOn postgresCreate
    targetContainerId postgresCreate.getContainerId()
}

task postgresRemove(type: DockerRemoveContainer) {
    force = true
    targetContainerId "$project.group-postgres"
}
