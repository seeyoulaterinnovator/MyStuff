plugins {
    id 'com.bmuschko.docker-remote-api' version '4.10.0'
}

import com.bmuschko.gradle.docker.tasks.container.*
import com.bmuschko.gradle.docker.tasks.image.*

version = '0.0.1'

allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }

    repositories {
        jcenter()
    }

    ext {
        keycloakVersion = '6.0.1'
        lombokVersion = '1.18.8'
        junitVersion = '5.5.0'
    }

    compileJava.options.encoding = 'UTF-8'

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
}

subprojects {

    version = rootProject.version + '-' + (System.getenv('CI_PIPELINE_ID') != null ? System.getenv('CI_PIPELINE_ID') : 'SNAPSHOT')
    group = 'ru.alamics.sso'
    sourceCompatibility = '11'

    buildDir = new File(rootProject.projectDir, "build/" + project.name)

    dependencies {
        annotationProcessor "org.projectlombok:lombok:$lombokVersion"
        compileOnly "org.projectlombok:lombok:$lombokVersion"

        testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitVersion"
        testImplementation 'org.assertj:assertj-core:3.12.2'
        testImplementation 'org.mockito:mockito-junit-jupiter:2.28.2'
    }

    test {
        useJUnitPlatform()
        reports.junitXml.destination = new File(rootProject.projectDir, "build/test-results/" + project.name)
        reports.html.destination = new File(rootProject.projectDir, "build/test-results/" + project.name + "/reports")
    }

}

task bundle {
    dependsOn(':keycloak-extension:bundle')
}

dependencies {
    implementation (
            project(':keycloak-extension'),
    )
}

test {
    dependsOn(':keycloak-extension:test')
}

//////////// DOCKER
// POSTGRES
task postgresPull(type: DockerPullImage) {
    repository = 'postgres'
    tag = "latest"
}

task postgresCreate(type: DockerCreateContainer) {
    dependsOn postgresPull
    targetImageId postgresPull.getImageId()
    containerName = "$project.group-postgres"
    portBindings = ['5433:5432']
    withEnvVar('POSTGRES_USER', 'postgres')
    withEnvVar('POSTGRES_PASSWORD', 'postgres')
    withEnvVar('POSTGRES_DB', 'keycloak')
}

task deploy {

    dependsOn(':keycloak-extension:war')

    def warArchive =  tasks.getByPath(':keycloak-extension:war').getArchiveFile()
    def themesFolder = tasks.getByPath(':keycloak-extension:processResources').getDestinationDir().getAbsolutePath() + '/themes'

    def deployDir = System.getenv('KEYCLOAK_DEPLOY_DIR') != null ? System.getenv('KEYCLOAK_DEPLOY_DIR'): "$rootProject.buildDir/deploy"
    def warTargetFolder = deployDir + '/standalone/deployments'
    def themesTargetFolder = deployDir + '/themes'

    inputs.files(warArchive, themesFolder)
    outputs.dirs(warTargetFolder, themesTargetFolder)

    doLast {
        copy {
            from file(warArchive)
            into(warTargetFolder)
            rename { String fileName ->
                fileName = "domru-sso.war"
            }
        }
        copy {
            from file(themesFolder)
            into(themesTargetFolder)
        }
    }
}

task postgresStart(type: DockerStartContainer) {
    dependsOn postgresCreate
    targetContainerId postgresCreate.getContainerId()
}

task postgresRemove(type: DockerRemoveContainer) {
    force = true
    targetContainerId "$project.group-postgres"
}
