name: "sso-new-cluster"
services:

  mariadb:
    image: mariadb:10.11
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: sso
      MYSQL_USER: sso
      MYSQL_PASSWORD: sso
      MYSQL_ROOT_PASSWORD: sa
      TZ: Asia/Yekaterinburg
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized" ]
    volumes:
      - ./volumes/mariadb/docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/:ro
    deploy:
      resources:
        limits:
          memory: 512M

  mockserver:
    image: mockserver/mockserver:5.15.0
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /initialization.json
      MOCKSERVER_WATCH_INITIALIZATION_JSON: true
    volumes:
      - ./volumes/mockserver/initialization.json:/initialization.json:ro
    deploy:
      resources:
        limits:
          memory: 256m

  smtp4dev:
    image: rnwood/smtp4dev:v3
    deploy:
      resources:
        limits:
          memory: 128m

  infinispan-a-1: &infinispan-a-1
    image: infinispan/server:15.0.10.Final
    environment: &infinispan-a-1-env
      USER: keycloak
      PASS: keycloak
      TZ: Etc/UTC
      SITE: A
      BACKUP_SITE: B
      MCAST_PORT: 46656
    entrypoint: "/entrypoint.sh"
    ports: [ "11221:11222" ]
    healthcheck:
      test: curl -s http://localhost:11222/rest/v2/container/health/status | grep -q 'HEALTHY' || exit 1
      interval: 5s
      retries: 12
    volumes:
      - ./volumes/infinispan/entrypoint.sh:/entrypoint.sh:ro
      - ./volumes/infinispan/user-config:/user-config/:ro
    deploy:
      resources:
        limits:
          memory: 396M

  infinispan-a-2:
    <<: *infinispan-a-1
    ports: [ "11222:11222" ]

  infinispan-b-1: &infinispan-b-1
    <<: *infinispan-a-1
    environment:
      <<: *infinispan-a-1-env
      SITE: B
      BACKUP_SITE: A
      MCAST_PORT: 46666
    ports: [ "21221:11222" ]

  infinispan-b-2:
    <<: *infinispan-b-1
    ports: [ "21222:11222" ]

  keycloak1: &keycloak1
    depends_on:
      mariadb:
        condition: service_healthy
      infinispan-a-1:
        condition: service_healthy
      infinispan-a-2:
        condition: service_healthy
      infinispan-b-1:
        condition: service_healthy
      infinispan-b-2:
        condition: service_healthy
    image: quay.io/keycloak/keycloak:25.0.2
    hostname: keycloak1
    command: [ "start" ]
    environment: &keycloak1-env
      KC_DB: mariadb
      KC_DB_URL_HOST: mariadb
      KC_DB_URL_PORT: 3306
      KC_DB_URL_DATABASE: sso
      KC_DB_USERNAME: sso
      KC_DB_PASSWORD: sso
      KC_LOG_CONSOLE_COLOR: true
      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_CACHE: ispn
      KC_CACHE_REMOTE_HOST: infinispan-a-1
      KC_CACHE_REMOTE_PORT: 11222
      KC_CACHE_REMOTE_TLS_ENABLED: false
      KC_CACHE_REMOTE_USERNAME: keycloak
      KC_CACHE_REMOTE_PASSWORD: keycloak
      KC_CACHE_CONFIG_FILE: cache-ispn.remote.xml
      KC_CACHE_STACK: tcp
      KC_SPI_USER_PROVIDER: customjpa
      KC_SPI_AUTHENTICATION_SESSIONS_PROVIDER: custom-remote
      KC_SPI_PASSWORD_POLICY_BLACKLIST_PROVIDER: ssoPasswordBlacklist
      KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_LEGACY_LOGOUT_REDIRECT_URI: true
      KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_SUPPRESS_LOGOUT_CONFIRMATION_SCREEN: true
      KC_SPI_HOSTNAME_PROVIDER: custom
      KC_SPI_COOKIE_PROVIDER: custom
      LIQUIBASE_COMMAND_CHANGE_EXEC_LISTENER_CLASS: ru.alamics.sso.keycloak.migration.CustomChangeExecListener
      TZ: Asia/Yekaterinburg
      SITE: STAGE5
    volumes:
      - ./configs/infinispan15/cache-ispn.remote.xml:/opt/keycloak/conf/cache-ispn.remote.xml:ro
      - ./build/keycloak-extension/libs/keycloak-extension-1.0.1-all.jar:/opt/keycloak/providers/keycloak-extension.jar:ro
    healthcheck:
      test: [
        "CMD-SHELL",
        'exec 3<>/dev/tcp/localhost/9000;
         echo -e "GET /health/ready HTTP/1.1\nhost: localhost:9000\n" >&3;
         timeout --preserve-status 1 cat <&3 | grep -m 1 status | grep -m 1 UP;
         ERROR=$?; exec 3<&-; exec 3>&-; exit $ERROR'
      ]
      interval: 5s
      retries: 36
    deploy:
      resources:
        limits:
          memory: 768M

  keycloak2:
    <<: *keycloak1
    hostname: keycloak2
    environment:
      <<: *keycloak1-env
      KC_CACHE_REMOTE_HOST: infinispan-b-1
      TZ: Europe/Moscow

  keycloak-config-cli:
    depends_on:
      keycloak1:
        condition: service_healthy
    image: adorsys/keycloak-config-cli:latest-25.0.1
    environment:
      KEYCLOAK_URL: http://keycloak1:8080/auth
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: true
      IMPORT_FILES_LOCATIONS: /config/*
    volumes:
      - ./volumes/keycloak-config-cli/config/:/config/:ro
    restart: no
    deploy:
      resources:
        limits:
          memory: 512M

  haproxy:
    depends_on:
      keycloak1:
        condition: service_healthy
      keycloak2:
        condition: service_healthy
    image: haproxy:2.9.9-alpine
    ports:
      - 8080:8080
    command: [ "haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg" ]
    volumes:
      - ./volumes/haproxy/usr/local/etc/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: nginx:1.15.3
    ports:
      - "8180:8180"
      - "80:80"
    volumes:
      - ./volumes/nginx/etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./volumes/nginx/usr/share/nginx/html:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          memory: 32m
