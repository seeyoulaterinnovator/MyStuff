dependencies {
    implementation (
            project(':custom-jpa-provider'),
    )
    compileOnly(group: "org.keycloak", name: "keycloak-dependencies-server-all", version: "$keycloakVersion")
    implementation group: 'org.apache.poi', name: 'poi', version: '5.3.0'
    implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '5.3.0'
    implementation group: 'com.opencsv', name: 'opencsv', version: '5.9'
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation group: 'com.helger', name: 'ph-css', version: '7.0.2'
}
