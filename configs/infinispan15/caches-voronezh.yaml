---
apiVersion: infinispan.org/v2alpha1
kind: Cache
metadata:
  name: customercache
  namespace: infinispan
spec:
  clusterName: infinispan
  name: customer_cache
  updates:
    strategy: recreate
  #language=yaml
  template: |-
    replicatedCache: 
      mode: "SYNC"
      remoteTimeout: "61000"
      statistics: "true"
      encoding:
        media-type: "application/x-jboss-marshalling"
      locking: 
        acquireTimeout: "60000"
      transaction: 
        mode: "NON_XA"
        locking: "PESSIMISTIC"
      expiration: 
        lifespan: "500000"
        maxIdle: "100000"
      stateTransfer: 
        timeout: "120000"
        chunkSize: "16"
#      backups:
#        perm:
#          backup:
#            strategy: "SYNC"
#            timeout: "60500"
#            failurePolicy: "WARN"
#            stateTransfer:
#              chunkSize: "16"
