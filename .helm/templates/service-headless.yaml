apiVersion: v1
kind: Service
metadata:
  name: {{ include "sso.fullname" . }}-headless
  labels:
    {{- include "sso.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: jgroups
      port: 7600
      targetPort: jgroups
      protocol: TCP
  selector:
    {{- include "sso.selectorLabels" . | nindent 4 }}