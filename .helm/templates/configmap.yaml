{{- if .Values.extraEnvs }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sso.fullname" . }}
  labels:
    {{- include "sso.labels" . | nindent 4 }}
    {{- with .Values.extraLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{- toYaml .Values.extraEnvs | nindent 2 }}
{{- end }}