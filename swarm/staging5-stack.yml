  #   ports:
  #     - "3306:3306"
  #   environment:
  #     - MYSQL_USER=${DB_USER:-sso}
  #     - MYSQL_PASSWORD=${DB_PASSWORD:-password}
  #     - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-12345678}
  #     - MYSQL_DATABASE=${DB_DATABASE:-sso3}
  #   volumes:
  #     - ./database:/var/lib/mysql:Z
