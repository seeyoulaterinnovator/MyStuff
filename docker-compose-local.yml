name: "sso-new"
services:

  mariadb:
    image: mariadb:10.11
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: sso
      MYSQL_USER: sso
      MYSQL_PASSWORD: sso
      MYSQL_ROOT_PASSWORD: sa
      TZ: Asia/Yekaterinburg
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized" ]
    volumes:
      - ./volumes/mariadb/docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/:ro

  mockserver:
    image: mockserver/mockserver:5.15.0
    ports:
      - "1080:1080"
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /initialization.json
      MOCKSERVER_WATCH_INITIALIZATION_JSON: true
    volumes:
      - ./volumes/mockserver/initialization.json:/initialization.json:ro

  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "25:25"
      - "8025:80"
    deploy:
      resources:
        limits:
          memory: 128m

  keycloak:
    depends_on:
      mariadb:
        condition: service_healthy
    image: quay.io/keycloak/keycloak:25.0.2
    hostname: keycloak
    ports:
      - "8080:8080"
      #- "9000:9000"
      - "8787:8787"
    entrypoint: /bin/sh -c "/opt/keycloak/bin/kc-custom.sh"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: mariadb
      KC_DB_URL_HOST: mariadb
      KC_DB_URL_PORT: 3306
      KC_DB_URL_DATABASE: sso
      KC_DB_USERNAME: sso
      KC_DB_PASSWORD: sso
      KC_LOG_LEVEL: INFO
      KC_LOG_CONSOLE_COLOR: true
      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_METRICS_ENABLED: true
      KC_HOSTNAME_DEBUG: true
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,address=0.0.0.0:8787,server=y,suspend=n"
      KC_CACHE: ispn
      KC_CACHE_CONFIG_FILE: cache-ispn-custom.xml
      KC_ADMIN_VITE_ENABLED: ${KC_ADMIN_VITE_ENABLED}
      KC_PROXY_HEADERS: xforwarded
      ERTH_SSO_E2E_ENABLED: ${ERTH_SSO_E2E_ENABLED}
      SITE: STAGE5
      KC_SPI_USER_PROVIDER: customjpa
      KC_SPI_AUTHENTICATION_SESSIONS_PROVIDER: custom
      KC_SPI_PASSWORD_POLICY_BLACKLIST_PROVIDER: ssoPasswordBlacklist
      LIQUIBASE_COMMAND_CHANGE_EXEC_LISTENER_CLASS: ru.alamics.sso.keycloak.migration.CustomChangeExecListener
      KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_LEGACY_LOGOUT_REDIRECT_URI: true
      KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_SUPPRESS_LOGOUT_CONFIRMATION_SCREEN: true
      APP_PROPS_UPDATE_DELAY_SECS: 60
      TZ: Asia/Yekaterinburg # Europe/Moscow
      QUARKUS_HTTP_ACCESS_LOG_ENABLED: false
      QUARKUS_HTTP_ACCESS_LOG_PATTERN: "long"
      DEV_HTTP_LOG_ALLOWED: true
    volumes:
      - ./volumes/keycloak/opt/keycloak/bin/kc-custom.sh:/opt/keycloak/bin/kc-custom.sh:ro
      - ./volumes/keycloak/opt/keycloak/conf/cache-ispn-custom.xml:/opt/keycloak/conf/cache-ispn-custom.xml:ro
      - ./build/keycloak-extension/libs/keycloak-extension-1.0.1-all.jar:/opt/keycloak/providers/keycloak-extension.jar:ro
      - ./keycloak-extension/src/main/resources/themes/keycloak.v2/admin:/opt/keycloak/themes-custom/keycloak.v2/admin:ro
      - ./keycloak-extension/src/main/resources/themes/domru/login:/opt/keycloak/themes-custom/domru/login:ro
    healthcheck:
      test: [
        "CMD-SHELL",
        'exec 3<>/dev/tcp/localhost/9000;
         echo -e "GET /health/ready HTTP/1.1\nhost: localhost:9000\n" >&3;
         timeout --preserve-status 1 cat <&3 | grep -m 1 status | grep -m 1 UP;
         ERROR=$?; exec 3<&-; exec 3>&-; exit $ERROR'
      ]
      interval: 5s
      retries: 36

  keycloak-config-cli:
    depends_on:
      keycloak:
        condition: service_healthy
    image: adorsys/keycloak-config-cli:latest-25.0.1
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: true
      IMPORT_FILES_LOCATIONS: /config/*
    volumes:
      - ./volumes/keycloak-config-cli/config/:/config/:ro
    restart: no

  nginx:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      # language=Dockerfile
      dockerfile_inline: |
        FROM alpine/openssl:3.3.2 as openssl
        RUN openssl req -newkey rsa:2048 -days 3650 -nodes -sha256 -x509 \
            -keyout /tmp/key.pem -out /tmp/cert.pem  \
            -subj "/C=RU/ST=PRM/L=Perm/O=My Inc/OU=Test/CN=www.erth.test/emailAddress=noreply@www.erth.test"
        FROM nginx:1.15.3
        COPY --from=openssl /tmp/key.pem /tmp/cert.pem /etc/nginx/ssl/default/
    ports:
      - "8180:8180"
      - "443:443"
    volumes:
      - ./volumes/nginx/etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./volumes/nginx/usr/share/nginx/html:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          memory: 32m
