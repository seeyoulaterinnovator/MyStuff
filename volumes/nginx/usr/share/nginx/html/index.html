<!doctype html>
<html lang="en">
<head>
    <title>Client</title>
</head>
<body>
<a href="/">Home</a>
<br>
<a href="http://localhost:8080/auth/admin/master/console/" target="_blank">Admin console</a>
<br>
<a href="http://localhost:8080/auth/admin/manager/console/" target="_blank">Manager console</a>
<br>
<a href="http://localhost:8025" target="_blank">SMTP4Dev</a>
<br>
<a href="http://localhost:1080/mockserver/dashboard" target="_blank">MockServer</a>
<br>
<div id="logon" hidden>
    <label for="realm">Realm</label>
    <select id="realm">
        <option value="user">user</option>
        <option value="e2e">e2e</option>
        <option value="S-TELECOM">S-TELECOM</option>
        <option value="ER-TELECOM">ER-TELECOM</option>
        <option value="novotelecom">novotelecom</option>
    </select>
    <br>
    <label for="client">Client</label>
    <select id="client">
        <option value="b2b">b2b</option>
        <option value="dmp-kc-sit">dmp-kc-sit</option>
        <option value="app">app</option>
        <option value="lkb2b">lkb2b</option>
        <option value="TOMS">TOMS</option>
    </select>
    <br>
    <label for="iframe">Iframe</label>
    <input id="iframe" type="checkbox">
    <br>
    <button id="go">Go</button>
</div>
<div id="redirect" hidden>
    <a id="account" href="">Account</a>
    <br>
    <button id="logout">Logout</button>
    <br>
    <button id="invalidLogout">Invalid logout</button>
    <br>
    <button id="asyncInvalidLogout">Async invalid logout</button>
</div>
<script>
  (async function (){
    const clientBaseUrl = 'http://localhost:8180';
    const kcBaseUrl = 'https://localhost:443/auth';
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    if(code) {
      const realm = params.get('realm');
      const client = params.get('client');
      const response = await fetch(`${clientBaseUrl}/keycloak/auth/realms/${realm}/protocol/openid-connect/token`, {
        method: 'post',
        body: new URLSearchParams({
          grant_type: 'authorization_code',
          client_id: client,
          redirect_uri: `${clientBaseUrl}/?realm=${realm}&client=${client}`,
          code
        }),
      });
      const result = await response.json();
      console.log(JSON.stringify(result));
      document.getElementById('account').setAttribute('href', `http://localhost:8080/auth/realms/${realm}/account`);
      document.getElementById('redirect').removeAttribute('hidden');
      document.getElementById('logout').onclick = () => {
        location.href =  `${kcBaseUrl}/realms/${realm}/protocol/openid-connect/logout?id_token_hint=${result.id_token}`;
      };
      document.getElementById('invalidLogout').onclick = () => {
        location.href =  `${kcBaseUrl}/realms/${realm}/protocol/openid-connect/logout?id_token_hint=${result.access_token}`;
      };
      document.getElementById('asyncInvalidLogout').onclick = async () => {
          await fetch(`${kcBaseUrl}/realms/${realm}/protocol/openid-connect/logout?id_token_hint=${result.access_token}&` + new URLSearchParams({
              post_logout_redirect_uri: ''
          }) , {
              mode: 'cors'
          });
          location.href = '/';
      };
    } else {
      document.getElementById('go').onclick = () => {
        const realm = document.getElementById('realm').value;
        const client = document.getElementById('client').value;
        const iframe = document.getElementById('iframe').checked ? { iframe: 1 } : {};
        const element = document.createElement('a');
        element.setAttribute('href', `${kcBaseUrl}/realms/${realm}/protocol/openid-connect/auth?` + new URLSearchParams({
            response_type: 'code',
            client_id: client,
            redirect_uri: `${clientBaseUrl}/?realm=${realm}&client=${client}`,
            scope: 'openid',
            ...iframe
        }));
        element.setAttribute('target', '_blank');
        element.setAttribute('hidden', 'hidden');
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
      };
      document.getElementById('logon').removeAttribute('hidden');
    }
  })();
</script>
</body>
</html>
